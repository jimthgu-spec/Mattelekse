<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matteverkstedet 9. trinn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
:root{--paper:#f3f6fb;--surface:#fff;--ink:#14213a;--muted:#56627a;--line:#d2dae7;--grid:#e2e8f1;--accent:#3350c4;--accent-soft:#e3e8fb;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1422;--surface:#161f33;--ink:#e7ecf6;--muted:#9ba7bf;--line:#2b3753;--grid:#1a2338;--accent:#8199f5;--accent-soft:#232f55;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1422;--surface:#161f33;--ink:#e7ecf6;--muted:#9ba7bf;--line:#2b3753;--grid:#1a2338;--accent:#8199f5;--accent-soft:#232f55;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:760px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left,0px)) 64px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{color:var(--muted);margin:0 0 28px}
.list{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:border-color .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.card h2{font-size:1.3rem;font-weight:700}
.card p{margin:6px 0 0;color:var(--muted)}
.tag{display:inline-block;margin-top:10px;font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.soon{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Matematikk · 9. trinn · LK20</div>
  <h1>Matteverkstedet</h1>
  <p class="lead">Velg en modul. Alt fungerer rett i nettleseren, også på mobil.</p>
  <ul class="list" id="list"></ul>
</main>
<script>
// Ny modul: legg HTML-fila i mappa «moduler/» og legg til én linje her.
const moduler = [
  { fil: "moduler/volum-prisme-sylinder.html", tittel: "Volumverkstedet", tekst: "Volum av prisme og sylinder, og omregning mellom cm³, dm³ og liter.", tema: "Geometri og volum" },
];
const ul = document.getElementById("list");
for (const m of moduler) {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "card"; a.href = m.fil;
  a.innerHTML = `<h2></h2><p></p><span class="tag"></span>`;
  a.querySelector("h2").textContent = m.tittel;
  a.querySelector("p").textContent = m.tekst;
  a.querySelector(".tag").textContent = m.tema;
  li.appendChild(a); ul.appendChild(li);
}
</script>
</body>
</html>
